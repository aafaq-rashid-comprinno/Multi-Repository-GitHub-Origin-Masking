server {
    listen 80;
    server_name repos.devopsnerds.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name repos.devopsnerds.com;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    resolver 8.8.8.8;
    
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_hide_header Server;
    add_header Server "CustomServer";

    # Repo 1
    location /aws-creds-manager {
        proxy_pass https://github.com/aafaq-rashid-comprinno/aws-creds-manager;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header X-Forwarded-Proto https;
        
        sub_filter 'github.com/aafaq-rashid-comprinno/aws-creds-manager' 'repos.devopsnerds.com/aws-creds-manager';
        sub_filter 'github.com' 'repos.devopsnerds.com';
        sub_filter_once off;
        sub_filter_types *;
    }

    # Repo 2
    location /mongo {
        proxy_pass https://github.com/aafaq-rashid-comprinno/mongo;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header X-Forwarded-Proto https;
        
        sub_filter 'github.com/aafaq-rashid-comprinno/mongo' 'repos.devopsnerds.com/mongo';
        sub_filter 'github.com' 'repos.devopsnerds.com';
        sub_filter_once off;
        sub_filter_types *;
    }

    location = / {
        return 200 "Available repos:\n- /aws-creds-manager\n- /mongo\n";
        add_header Content-Type text/plain;
    }
}
