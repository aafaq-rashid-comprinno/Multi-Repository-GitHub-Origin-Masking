server {
    listen 80;
    server_name vcs.hivepro.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vcs.hivepro.com;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    resolver 8.8.8.8;
    
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_hide_header Server;
    add_header Server "CustomServer";

    # Dynamic routing for all repos
    location ~ ^/(.+)$ {
        proxy_pass https://github.com/readonlyuserhivepro/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header X-Forwarded-Proto https;
        
        sub_filter 'github.com/readonlyuserhivepro/' 'vcs.hivepro.com/';
        sub_filter 'github.com' 'vcs.hivepro.com';
        sub_filter_once off;
        sub_filter_types *;
    }

    location = / {
        return 200 "Version Control System - Access repositories: https://vcs.hivepro.com/<repo-name>\n";
        add_header Content-Type text/plain;
    }
}
