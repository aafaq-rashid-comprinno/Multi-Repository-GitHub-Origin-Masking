server {
    listen 80;
    server_name repos.devopsnerds.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name repos.devopsnerds.com;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    resolver 8.8.8.8;
    
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_hide_header Server;
    add_header Server "CustomServer";

    # Dynamic routing for all repos
    location ~ ^/(.+)$ {
        # Block browser access, only allow git CLI
        if ($http_user_agent !~* "^git/") {
            return 403 "Access denied. Git CLI only.\n";
        }
        
        proxy_pass https://github.com/aafaq-rashid-comprinno/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header X-Forwarded-Proto https;
        
        sub_filter 'github.com/aafaq-rashid-comprinno/' 'repos.devopsnerds.com/';
        sub_filter 'github.com' 'repos.devopsnerds.com';
        sub_filter_once off;
        sub_filter_types *;
    }

    location = / {
        # Allow health checks, block browsers
        if ($http_user_agent !~* "ELB-HealthChecker") {
            return 403 "Access denied. Git CLI only.\n";
        }
        return 200 "Version Control System - Access any repo: https://repos.devopsnerds.com/<repo-name>\n";
        add_header Content-Type text/plain;
    }
}
